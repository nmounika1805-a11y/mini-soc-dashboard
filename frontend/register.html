<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Mini SOC - Register</title>

    <link rel="stylesheet" href="style.css">

</head>

<body class="auth-page">

<div class="auth-container">

    <div class="auth-card">

        <div class="logo">
            🛡️
        </div>

        <h1>Create Account</h1>

        <p class="subtitle">
            Join Mini SOC Dashboard
        </p>

        <form id="registerForm">

            <label>Name</label>

            <input
                type="text"
                id="name"
                placeholder="Enter your name"
                required
            >

            <label>Email</label>

            <input
                type="email"
                id="email"
                placeholder="Enter your email"
                required
            >

            <label>Password</label>

            <input
                type="password"
                id="password"
                placeholder="Minimum 6 characters"
                required
            >

            <button
                type="submit"
                id="registerButton"
                class="primary-button"
            >
                Register
            </button>

        </form>

        <p id="message" class="message"></p>

        <p class="auth-link">

            Already have an account?

            <a href="login.html">
                Login
            </a>

        </p>

    </div>

</div>

<script src="register.js"></script>

</body>
</html>

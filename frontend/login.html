<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Mini SOC - Login</title>

    <link rel="stylesheet" href="login.css">
</head>

<body class="auth-page">

    <div class="auth-container">

        <div class="auth-card">

            <div class="logo">
                🛡️
            </div>

            <h1>Mini SOC</h1>

            <p class="subtitle">
                Security Operations Center
            </p>

            <h2>Login</h2>

            <form id="loginForm">

                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required
                >

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    required
                >

                <button
                    type="submit"
                    id="loginButton"
                    class="primary-button"
                >
                    Login
                </button>

                <p
                    id="message"
                    class="message"
                ></p>

            </form>

            <p class="auth-link">
                Don't have an account?
                <a href="register.html">
                    Register
                </a>
            </p>

        </div>

    </div>

    <script src="login.js"></script>

</body>

</html>
